app = "fishcount"
primary_region = "sjc"

[build]

[env]
  DB_PATH = "/data/fishcount.sqlite3"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  TZ = "America/Los_Angeles"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[mounts]]
  source = "fishcount_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
